name: Build PTS Honda Flash Studio EXE
on:
  push:
    branches:
      - codex/pts-honda-flash-studio-exe
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install pyinstaller pyserial
      - name: Build GUI executable
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name PTS_Honda_Flash_Studio honda_studio/PTS_Honda_Flash_Studio.py
      - name: Verify output exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/PTS_Honda_Flash_Studio.exe")) { throw "EXE missing" }
          Get-FileHash "dist/PTS_Honda_Flash_Studio.exe" -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: PTS_Honda_Flash_Studio_Windows_EXE
          path: dist/PTS_Honda_Flash_Studio.exe
          if-no-files-found: error
