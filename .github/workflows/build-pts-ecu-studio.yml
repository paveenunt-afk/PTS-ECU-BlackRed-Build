name: Build PTS ECU Studio Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'pts-ecu-studio/**'
      - '.github/workflows/build-pts-ecu-studio.yml'
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pyserial==3.5 pyinstaller==6.16.0
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PTS_ECU_Studio_v03 pts-ecu-studio/main.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PTS_ECU_Studio_v03_Windows_EXE
          path: dist/PTS_ECU_Studio_v03.exe
          if-no-files-found: error
