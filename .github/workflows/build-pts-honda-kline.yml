name: Build PTS Honda KLine Theme EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'pts-honda-kline/**'
      - '.github/workflows/build-pts-honda-kline.yml'
jobs:
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pyserial==3.5 pillow==11.3.0 pyinstaller==6.16.0
      - name: Build single EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PTS_Honda_KLine_Theme_v02 pts-honda-kline/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: PTS_Honda_KLine_Theme_v02_Windows_EXE
          path: dist/PTS_Honda_KLine_Theme_v02.exe
          if-no-files-found: error
