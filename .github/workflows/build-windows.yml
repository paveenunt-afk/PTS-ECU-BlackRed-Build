name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build application executable
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm PTS_ECU_BlackRed.spec

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build single-file installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer.nsi
          if (-not (Test-Path "PTS_ECU_BlackRed_v10_Setup.exe")) { throw "Installer was not created" }

      - name: Upload installer and portable program
        uses: actions/upload-artifact@v4
        with:
          name: PTS_ECU_BlackRed_v10_Program_and_Setup
          path: |
            PTS_ECU_BlackRed_v10_Setup.exe
            dist/PTS_ECU_BlackRed_v10.exe
          if-no-files-found: error
          retention-days: 7
