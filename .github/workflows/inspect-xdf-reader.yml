name: Inspect public XDF native reader
on:
  push:
    branches: [pts-studio-3-windows-icons]
    paths: ['.github/workflows/inspect-xdf-reader.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download official public installer
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://www.tunerpro.net/download/SetupTunerProFree_v500_10337.exe' -OutFile setup.exe -UserAgent 'Mozilla/5.0'
          $p=Start-Process .\setup.exe -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR=C:\TunerProResearch' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer failed $($p.ExitCode)" }
          Get-ChildItem C:\TunerProResearch
      - name: Save reader for compatibility analysis
        uses: actions/upload-artifact@v4
        with:
          name: public-xdf-reader-research
          path: |
            C:/TunerProResearch/XDFEditor.dll
            C:/TunerProResearch/TunerPro.exe
          if-no-files-found: error
          retention-days: 1
