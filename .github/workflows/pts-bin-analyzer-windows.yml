name: PTS BIN Analyzer Windows EXE
on:
  push:
    branches: [codex/pts-bin-analyzer-exe-20261030]
    paths:
      - 'bin-analyzer/**'
      - '.github/workflows/pts-bin-analyzer-windows.yml'
permissions:
  contents: read
jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install build dependencies
        run: python -m pip install "pyinstaller>=6,<7" "capstone>=5,<6" "pylibftdi>=0.23,<0.24"
      - name: Test source UI and analyzer
        working-directory: bin-analyzer
        run: python windows_main.py --self-test
      - name: Build Windows executable
        working-directory: bin-analyzer
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --console --noupx
          --name PTS_BIN_Analyzer_v3
          --add-data "ecu_catalog.tsv;."
          --add-data "LICENSE;."
          --add-data "SOURCES.txt;."
          --add-data "README_TH.txt;."
          --add-data "FLASH_EXPERIMENT_README_TH.txt;."
          --add-data "vendor;vendor"
          --hidden-import pylibftdi --collect-all capstone
          windows_main.py
      - name: Test packaged executable on Windows
        working-directory: bin-analyzer
        shell: pwsh
        run: |
          $job = Start-Process -FilePath "dist/PTS_BIN_Analyzer_v3.exe" -ArgumentList "--self-test" -PassThru -RedirectStandardOutput "exe-smoke.txt" -RedirectStandardError "exe-smoke-error.txt"
          if (-not $job.WaitForExit(90000)) { $job.Kill(); throw "EXE smoke test timed out" }
          Get-Content exe-smoke.txt
          Get-Content exe-smoke-error.txt
          if ($job.ExitCode -ne 0) { throw "EXE smoke test failed" }
          if (-not (Select-String -Path exe-smoke.txt -Pattern '"status": "passed"' -Quiet)) { throw "EXE did not report a passing smoke test" }
          Get-FileHash dist/PTS_BIN_Analyzer_v3.exe -Algorithm SHA256 | Format-List | Out-File SHA256.txt
      - name: Upload executable and validation
        uses: actions/upload-artifact@v4
        with:
          name: PTS_BIN_Analyzer_v3_Windows_x64
          path: |
            bin-analyzer/dist/PTS_BIN_Analyzer_v3.exe
            bin-analyzer/exe-smoke.txt
            bin-analyzer/exe-smoke-error.txt
            bin-analyzer/SHA256.txt
          if-no-files-found: error
          retention-days: 30
